<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f766e">
<title>墨尔本旅行记录</title>
<style>
  :root{
    --teal:#0f766e; --teal-d:#115e59; --teal-l:#14b8a6;
    --amber:#f59e0b; --amber-bg:#fff7ed; --amber-bd:#fcd34d;
    --ink:#1f2937; --sub:#64748b; --line:#e2e8f0;
    --bg:#f5f7f7; --card:#ffffff; --soft:#eef4f4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.65; font-size:16px; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:480px; margin:0 auto; background:var(--bg); min-height:100vh; padding-bottom:40px;}
  .hero{background:linear-gradient(135deg,#0f3d3a,#1b7f6a); color:#fff; padding:26px 20px 20px;}
  .hero .kick{font-size:12.5px; letter-spacing:2px; opacity:.85; text-transform:uppercase; margin:0 0 6px;}
  .hero h1{margin:0 0 8px; font-size:25px; font-weight:800;}
  .hero .sub{font-size:13.5px; opacity:.94; margin:0;}
  .gate{display:none;} .gate.show{display:block;}
  .gate-inner{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px 22px;
    margin:18px 16px; box-shadow:0 2px 8px rgba(15,118,110,.06); text-align:center;}
  .gate-inner .lock{font-size:40px; margin-bottom:8px;}
  .gate-inner h2{margin:0 0 6px; font-size:18px; color:var(--teal-d);}
  .gate-inner p{margin:0 0 18px; font-size:13.5px; color:var(--sub);}
  .gate-inner input{width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px;
    font-size:16px; text-align:center; letter-spacing:3px; outline:none; color:var(--ink);}
  .gate-inner input:focus{border-color:var(--teal-l);}
  .gate-inner button{margin-top:12px; width:100%; padding:12px; border:none; border-radius:12px;
    background:var(--teal); color:#fff; font-size:16px; font-weight:700; cursor:pointer;}
  .gate-err{display:none; color:#dc2626; font-size:13px; margin-top:10px;} .gate-err.show{display:block;}
  .content{display:none;} .content.show{display:block;}
  .sec-title{display:flex; align-items:center; gap:8px; font-size:18px; font-weight:800; color:var(--teal-d);
    margin:20px 16px 12px;}
  .sec-title .ic{width:26px; height:26px; border-radius:8px; background:var(--soft); color:var(--teal);
    display:flex; align-items:center; justify-content:center; font-size:15px;}
  .day-link{display:block; text-decoration:none; color:inherit;}
  .day-card{display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:14px 16px; margin:0 16px 12px; box-shadow:0 1px 3px rgba(15,118,110,.05);}
  .day-card .num{flex:0 0 46px; height:46px; border-radius:12px;
    background:linear-gradient(135deg,var(--teal-d),var(--teal-l)); color:#fff; display:flex;
    align-items:center; justify-content:center; font-weight:800; font-size:15px;}
  .day-card .info{flex:1; min-width:0;}
  .day-card .t{font-weight:700; font-size:15.5px; color:var(--ink);}
  .day-card .d{font-size:13px; color:var(--sub); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .day-card .arrow{color:var(--teal-l); font-size:18px; flex:0 0 auto;}
  .back{display:block; text-align:center; color:var(--teal); font-size:13.5px; font-weight:600; padding:12px; text-decoration:none;}
  .foot{text-align:center; font-size:12px; color:var(--sub); padding:20px 16px 0;}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <p class="kick">Melbourne Travel Record</p>
    <h1>墨尔本旅行记录</h1>
    <p class="sub">9/29 – 10/0x · 每天的实际行程与照片</p>
  </div>

  <div class="gate" id="gate">
    <div class="gate-inner">
      <div class="lock">🔒</div>
      <h2>输入密码查看</h2>
      <p>这是家人私享的旅行记录</p>
      <input type="password" id="pwd" placeholder="请输入密码" inputmode="text" autocomplete="off">
      <button onclick="tryUnlock()">进入</button>
      <div class="gate-err" id="err">密码不对，再试试</div>
    </div>
  </div>

  <div class="content" id="content">
    <div class="sec-title"><span class="ic">📷</span>墨尔本旅行记录</div>
    <a class="day-link" href="rec-mel-1001.html">
      <div class="day-card">
        <div class="num">10.1</div>
        <div class="info"><div class="t">雨里的市场与博物馆</div><div class="d">QVM 买菜 · 卡尔顿花园 · 墨尔本博物馆 · 女巫店抽签</div></div>
        <span class="arrow">›</span>
      </div>
    </a>

    <div class="sec-title" style="margin-top:26px;"><span class="ic">📖</span>看看行程</div>
    <a class="day-link" href="index.html">
      <div class="day-card">
        <div class="num">🏙</div>
        <div class="info"><div class="t">2026 澳新旅行手册</div><div class="d">悉尼 + 墨尔本全部攻略与计划</div></div>
        <span class="arrow">›</span>
      </div>
    </a>
    <a class="day-link" href="records-sydney.html">
      <div class="day-card">
        <div class="num">📷</div>
        <div class="info"><div class="t">悉尼旅行记录</div><div class="d">9/22 – 9/28 的实际行程与照片</div></div>
        <span class="arrow">›</span>
      </div>
    </a>

    <a class="back" href="index.html">‹ 返回手册首页</a>
    <div class="foot">Essie 的旅行手册 · 旅行记录 · 仅供家人查看</div>
  </div>

</div>
<script>
var PASSWORD = "lxjh2026";
function tryUnlock(){
  var v = document.getElementById('pwd').value.trim();
  if(v === PASSWORD){
    sessionStorage.setItem('essie_unlocked','1');
    document.getElementById('gate').classList.remove('show');
    document.getElementById('content').classList.add('show');
    document.getElementById('err').classList.remove('show');
  } else {
    document.getElementById('err').classList.add('show');
    document.getElementById('pwd').value='';
  }
}
document.getElementById('pwd').addEventListener('keydown', function(e){ if(e.key==='Enter') tryUnlock(); });
if(sessionStorage.getItem('essie_unlocked')==='1'){ document.getElementById('content').classList.add('show'); }
else { document.getElementById('gate').classList.add('show'); }
</script>
</body>
</html>
