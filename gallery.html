<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f766e">
<meta name="robots" content="noindex, nofollow">
<title>旅行记录 · 悉尼大学照片墙</title>
<style>
  :root{
    --teal:#0f766e; --teal-d:#115e59; --teal-l:#14b8a6;
    --amber:#f59e0b; --amber-bg:#fff7ed; --amber-bd:#fcd34d;
    --ink:#1f2937; --sub:#64748b; --line:#e2e8f0;
    --bg:#f5f7f7; --card:#ffffff; --soft:#eef4f4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6; font-size:16px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px; margin:0 auto; background:var(--bg); min-height:100vh; padding-bottom:44px;}

  .hero{background:linear-gradient(135deg,var(--teal-d),var(--teal-l)); color:#fff; padding:22px 20px 18px;}
  .hero h1{margin:0 0 6px; font-size:23px; font-weight:800; letter-spacing:.5px;}
  .hero .sub{font-size:13.5px; opacity:.92; margin:0;}
  .hero .badge{display:inline-block; margin-top:12px; background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35); padding:5px 12px; border-radius:999px; font-size:13px; font-weight:600;}

  .back{display:flex; align-items:center; gap:8px; margin:12px 16px 0; text-decoration:none;
    color:var(--teal-d); font-size:14px; font-weight:600;}
  .back .arr{width:30px; height:30px; border-radius:10px; background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:15px;}

  section{padding:14px 16px 0;}
  .sec-title{display:flex; align-items:baseline; gap:8px; font-size:17px; font-weight:800; color:var(--teal-d); margin:10px 0 4px;}
  .sec-title .cnt{font-size:12.5px; font-weight:600; color:var(--sub);}
  .sec-desc{font-size:13px; color:var(--sub); margin:0 0 10px;}

  .masonry{column-count:2; column-gap:10px;}
  figure{break-inside:avoid; margin:0 0 12px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; overflow:hidden; box-shadow:0 1px 3px rgba(15,118,110,.05);}
  figure a{display:block; text-decoration:none;}
  figure img{width:100%; display:block; background:var(--soft);}
  figcaption{font-size:12.5px; color:#475569; padding:7px 9px 9px; text-align:center; line-height:1.45;}

  .note{font-size:13px; color:var(--sub); margin:14px 18px 0; line-height:1.6;
    background:var(--amber-bg); border:1px solid var(--amber-bd); border-radius:12px; padding:10px 12px;}
  .foot{text-align:center; font-size:12px; color:var(--sub); padding:22px 16px 0;}
  .top{display:block; text-align:center; color:var(--teal); font-size:13px; font-weight:600; padding:10px; text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <h1>📷 旅行记录 · 照片墙</h1>
    <p class="sub">9.28 悉尼大学 · 哈利波特楼的一天</p>
    <span class="badge">26 张照片 · 3 个篇章</span>
  </div>

  <a class="back" href="index.html"><span class="arr">‹</span> 返回手册首页</a>

  <!-- 篇章一：主楼 -->
  <section>
    <div class="sec-title">🏛 主楼 · 哈利波特楼 <span class="cnt">9 张</span></div>
    <p class="sec-desc">1850 年建校的砂岩哥特主楼，也是《哈利·波特》电影气质拉满的拍照圣地。</p>
    <div class="masonry">
      <figure><a href="photos/0928-usyd-01.jpg" target="_blank"><img src="photos/0928-usyd-01.jpg" alt="校名墙前打卡" loading="lazy"><figcaption>校名墙前打卡</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-02.jpg" target="_blank"><img src="photos/0928-usyd-02.jpg" alt="同款机位妈妈版" loading="lazy"><figcaption>同款机位 · 妈妈版</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-03.jpg" target="_blank"><img src="photos/0928-usyd-03.jpg" alt="主楼拱门下歇脚" loading="lazy"><figcaption>主楼拱门下歇脚</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-05.jpg" target="_blank"><img src="photos/0928-usyd-05.jpg" alt="钟塔下的妈妈" loading="lazy"><figcaption>钟塔下的妈妈</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-06.jpg" target="_blank"><img src="photos/0928-usyd-06.jpg" alt="拱门外就是大草坪" loading="lazy"><figcaption>拱门外就是大草坪</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-07.jpg" target="_blank"><img src="photos/0928-usyd-07.jpg" alt="打卡成功" loading="lazy"><figcaption>打卡成功 ✌️</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-08.jpg" target="_blank"><img src="photos/0928-usyd-08.jpg" alt="大草坪与主楼庭院" loading="lazy"><figcaption>大草坪 &amp; 主楼庭院</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-24.jpg" target="_blank"><img src="photos/0928-usyd-24.jpg" alt="主楼露台合影" loading="lazy"><figcaption>主楼露台合影</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-25.jpg" target="_blank"><img src="photos/0928-usyd-25.jpg" alt="露台上远眺" loading="lazy"><figcaption>露台上远眺</figcaption></a></figure>
    </div>
  </section>

  <!-- 篇章二：校园漫步 -->
  <section>
    <div class="sec-title">🚶 校园漫步 · 含涂鸦隧道 <span class="cnt">14 张</span></div>
    <p class="sec-desc">蓝色天桥、红砖长廊、涂鸦隧道，还有校园里的动物邻居。</p>
    <div class="masonry">
      <figure><a href="photos/0928-usyd-09.jpg" target="_blank"><img src="photos/0928-usyd-09.jpg" alt="网红涂鸦隧道" loading="lazy"><figcaption>网红涂鸦隧道</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-04.jpg" target="_blank"><img src="photos/0928-usyd-04.jpg" alt="校园原住民乌鸦" loading="lazy"><figcaption>校园原住民：乌鸦大爷</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-10.jpg" target="_blank"><img src="photos/0928-usyd-10.jpg" alt="君子兰" loading="lazy"><figcaption>花开正好的君子兰</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-11.jpg" target="_blank"><img src="photos/0928-usyd-11.jpg" alt="长椅歇脚" loading="lazy"><figcaption>长椅上歇口气</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-12.jpg" target="_blank"><img src="photos/0928-usyd-12.jpg" alt="蓝色天桥下的爸爸" loading="lazy"><figcaption>蓝色天桥下</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-13.jpg" target="_blank"><img src="photos/0928-usyd-13.jpg" alt="天桥下的背影" loading="lazy"><figcaption>天桥下的背影</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-14.jpg" target="_blank"><img src="photos/0928-usyd-14.jpg" alt="Macleay大楼" loading="lazy"><figcaption>Macleay 大楼 · 楼顶藏着老天文台圆顶</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-15.jpg" target="_blank"><img src="photos/0928-usyd-15.jpg" alt="转角遇见哥特" loading="lazy"><figcaption>转角遇见哥特</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-16.jpg" target="_blank"><img src="photos/0928-usyd-16.jpg" alt="红砖长廊" loading="lazy"><figcaption>红砖长廊</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-17.jpg" target="_blank"><img src="photos/0928-usyd-17.jpg" alt="红砖长廊的爸爸" loading="lazy"><figcaption>同一条长廊的爸爸</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-18.jpg" target="_blank"><img src="photos/0928-usyd-18.jpg" alt="长廊尽头的梧桐" loading="lazy"><figcaption>长廊尽头的梧桐树</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-20.jpg" target="_blank"><img src="photos/0928-usyd-20.jpg" alt="维多利亚公园望主楼" loading="lazy"><figcaption>从维多利亚公园望主楼</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-23.jpg" target="_blank"><img src="photos/0928-usyd-23.jpg" alt="Anderson Stuart大楼" loading="lazy"><figcaption>Anderson Stuart 医学院大楼</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-26.jpg" target="_blank"><img src="photos/0928-usyd-26.jpg" alt="主楼前的自拍" loading="lazy"><figcaption>主楼前的自拍 · 收工</figcaption></a></figure>
    </div>
  </section>

  <!-- 篇章三：甜品与小彩蛋 -->
  <section>
    <div class="sec-title">🧋 港式甜品 &amp; 小彩蛋 <span class="cnt">3 张</span></div>
    <p class="sec-desc">校园里的意外惊喜：一秒穿越香港的壁画，和一张有意思的海报。</p>
    <div class="masonry">
      <figure><a href="photos/0928-usyd-21.jpg" target="_blank"><img src="photos/0928-usyd-21.jpg" alt="糖朝壁画" loading="lazy"><figcaption>一秒穿越香港的糖朝壁画</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-22.jpg" target="_blank"><img src="photos/0928-usyd-22.jpg" alt="港式甜品站" loading="lazy"><figcaption>校园里的港式甜品站</figcaption></a></figure>
      <figure><a href="photos/0928-usyd-19.jpg" target="_blank"><img src="photos/0928-usyd-19.jpg" alt="中文讲座海报" loading="lazy"><figcaption>小彩蛋：墙上发现的中文讲座海报（10/10 悉尼大学）</figcaption></a></figure>
    </div>
  </section>

  <div class="note">💡 点任意照片可查看原图。照片墙会随旅程持续更新，之后的墨尔本照片也会加进来。</div>

</html>
